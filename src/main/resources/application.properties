spring.application.name=spiralos-telemetry

# --- Error handling: never leak internals to the browser ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# --- Session cookie hardening ---
server.servlet.session.cookie.name=SPIRALOS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SPIRALOS_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# --- Connection limit: each open connection costs Tomcat ~20-30 KB of buffers. The default
# (8,192) let a slowloris attack exhaust a 256 MB heap on Linux. 1,000 caps that at ~30 MB;
# past it, new connections wait in the OS queue instead of crashing the server.
server.tomcat.max-connections=1000

# --- SpiralOS ---
spiralos.sampler.interval-ms=2000
spiralos.settings.path=./spiralos-settings.properties
spiralos.logs.files=