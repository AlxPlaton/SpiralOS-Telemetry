<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>SpiralOS · Dashboard</title>
</head>
<body>
  <div class="scan-sweep" aria-hidden="true"></div>
  <div class="dashboard-container">
    <header class="topbar" id="topbar"></header>

    <section class="metrics-grid" id="dashboard">
      <article class="metric-card" id="card-cpu">
        <div class="metric-head"><span class="metric-label">CPU utilization</span><span class="metric-flag" id="cpu-flag">nominal</span></div>
        <div class="metric-value" id="cpu-value">--</div>
        <svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline id="cpu-spark-line" points="" /></svg>
        <div class="metric-sub" id="cpu-sub">--</div>
      </article>
      <article class="metric-card" id="card-ram">
        <div class="metric-head"><span class="metric-label">Memory usage</span><span class="metric-flag" id="ram-flag">nominal</span></div>
        <div class="metric-value" id="ram-value">--</div>
        <svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline id="ram-spark-line" points="" /></svg>
        <div class="metric-sub" id="ram-sub">--</div>
      </article>
      <article class="metric-card" id="card-net">
        <div class="metric-head"><span class="metric-label">Network I/O</span><span class="metric-flag" id="net-flag">nominal</span></div>
        <div class="metric-value" id="net-value">--</div>
        <svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline id="net-spark-line" points="" /></svg>
        <div class="metric-sub"><span id="net-up">▲ --</span><span id="net-down">▼ --</span></div>
      </article>
    </section>

    <section class="table-section">
      <div class="table-head"><h2>Top processes</h2><span class="table-sub">by current CPU load</span></div>
      <div class="table-scroll">
        <table class="process-table">
          <thead><tr>
            <th class="col-pid">Pid</th><th>Name</th><th class="col-num">CPU %</th><th class="col-num">Memory</th><th class="col-status">Status</th>
          </tr></thead>
          <tbody id="process-body"></tbody>
        </table>
      </div>
      <p class="table-foot"><a href="/processes.html">View all processes</a></p>
    </section>
  </div>
  <script src="common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
